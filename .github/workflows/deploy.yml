# Deploy Examia on every push to main.
# Recommended: HTTPS webhook (GitHub Actions often cannot SSH to Hostinger on port 22).
name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via webhook (recommended)
        if: ${{ secrets.DEPLOY_WEBHOOK_SECRET != '' && secrets.DEPLOY_URL != '' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          BASE="${DEPLOY_URL%/}"
          echo "Triggering deploy at ${BASE}/api/deploy/webhook"
          HTTP_CODE=$(curl -sS -m 30 -o /tmp/deploy-response.json -w "%{http_code}" -X POST \
            -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_SECRET}" \
            "${BASE}/api/deploy/webhook")
          cat /tmp/deploy-response.json
          echo ""
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook deploy failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Deploy triggered successfully (HTTP ${HTTP_CODE})."

      - name: Deploy via SSH (fallback if webhook secrets are not set)
        if: ${{ secrets.DEPLOY_WEBHOOK_SECRET == '' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            export EXAMIA_DIR=/var/www/examia
            bash $EXAMIA_DIR/deploy/deploy.sh

      - name: Check deploy is configured
        if: ${{ always() }}
        env:
          HAS_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_SECRET != '' && secrets.DEPLOY_URL != '' }}
          HAS_SSH: ${{ secrets.DEPLOY_WEBHOOK_SECRET == '' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          if [ "$HAS_WEBHOOK" = "true" ] || [ "$HAS_SSH" = "true" ]; then
            exit 0
          fi
          echo "::error::No deploy method configured."
          echo "Add GitHub secrets DEPLOY_URL + DEPLOY_WEBHOOK_SECRET (recommended),"
          echo "or DEPLOY_HOST + DEPLOY_USER + DEPLOY_SSH_KEY. See deploy/README.md"
          exit 1
